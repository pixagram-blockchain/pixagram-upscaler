[package]
name = "renderart"
version = "0.3.0"
edition = "2021"
authors = []
description = "High-performance pixel art rendering engines for WebAssembly"
license = "MIT"
repository = ""

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/wasm/lib.rs"

[dependencies]
wasm-bindgen = "0.2.92"
bytemuck = "1.24.0"
# Multi-threading (enabled via the `parallel` feature). These pull in a
# SharedArrayBuffer-backed thread pool and are only compiled when requested.
rayon = { version = "1.10", optional = true }
wasm-bindgen-rayon = { version = "1.2", optional = true }
parking_lot = "0.12.5"

[features]
default = []
# Enable data-parallel rendering across a wasm-bindgen-rayon thread pool.
# Requires a nightly toolchain + atomics target features to build (see the
# `build:wasm:threads` npm script) and a cross-origin-isolated page to run.
parallel = ["dep:rayon", "dep:wasm-bindgen-rayon"]
# Use the 24-bit (888) YCbCr distance lookup table instead of the 15-bit (555)
# one: higher xBRZ color fidelity at the cost of a much larger table.
large_lut = []

[dev-dependencies]
wasm-bindgen-test = "0.3.42"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4", "--enable-simd"]
